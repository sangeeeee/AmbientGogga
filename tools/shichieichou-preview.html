<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>七影蝶 · 翅面与尾突</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#e4eafb;background:#0b1220;font:15px system-ui,"Microsoft YaHei",sans-serif}main{max-width:1100px;margin:auto;padding:38px 36px}h1{font-size:30px;font-weight:500;margin:8px 0 12px}p{color:#a6b3cb;line-height:1.8}.label{font-size:11px;letter-spacing:3px;color:#73d9eb}canvas{width:100%;height:560px;display:block;cursor:grab;border-radius:20px;border:1px solid #263348;background:radial-gradient(ellipse at 50% 50%,#1d2b46,#0b1220 78%)}.controls{display:flex;flex-wrap:wrap;gap:20px;align-items:center;margin:20px 0}button{border:1px solid #45566c;border-radius:8px;background:#18253a;color:#d8e9ff;padding:8px 15px;cursor:pointer}input{accent-color:#8bdded;vertical-align:middle}.note{font-size:12px}footer{border-top:1px solid #293349;margin-top:28px;padding-top:18px;display:flex;gap:35px}footer b{font-weight:500;color:#b4dce6}footer p{font-size:13px;margin:5px 0}@media(max-width:700px){main{padding:24px 18px}canvas{height:440px}footer{display:block}}
</style>
<main><div class="label">AMBIENT GOGGA / MOTION STUDY</div><h1>七影蝶 · 翅面与尾突</h1><p>下拍缓起后加速、快速制动；上抬平稳，顶部缓停。拖动可旋转视角，滚轮缩放。</p>
<canvas id="scene"></canvas><div class="controls"><button id="play">暂停</button><button id="front">正面</button><button id="side">侧面</button><button id="top">俯视</button><label>播放速度 <input id="speed" type="range" min="0.15" max="1.5" step="0.05" value="1"></label><label><input id="wire" type="checkbox"> 显示分段</label></div>
<div class="note" id="status">正在加载预览…</div><footer><div><b>柔性翅面</b><p>上抬 75° · 下压 45° · 约 1.8 秒一周期。下拍约占 42%，上抬约占 58%。</p></div><div><b>下垂尾突</b><p>每侧一条长尾，越靠近末端越硬，抑制鞭梢颤抖。</p></div><div><b>保留花纹</b><p>浅白身体保留头胸腹层次及触须，去掉脚和繁杂细节。</p></div></footer>
<p class="note">此页使用实际模型与尾部模拟数据，身体仰角约 45°。预览采用简化照明；粉尘请查看游戏内截图。</p></main>
<script>
const data=__MESH_DATA__;
const textureSource='__TEXTURE_DATA__';
const bodyTextureSource='__BODY_TEXTURE_DATA__';
const canvas=document.querySelector('canvas'),gl=canvas.getContext('webgl',{alpha:true,antialias:true,preserveDrawingBuffer:true});
if(!gl)throw Error('WebGL unavailable');
const vs=`attribute vec3 p;attribute vec2 uv;attribute vec3 tint;uniform float yaw,pitch,zoom,aspect,anatomy,bodyPitch,bodyRoll;varying vec3 col;varying vec2 t;varying float shade;void main(){vec3 v=p;if(anatomy>.5){v=vec3(v.x,v.y*cos(bodyPitch)-v.z*sin(bodyPitch),v.y*sin(bodyPitch)+v.z*cos(bodyPitch));v=vec3(v.x*cos(bodyRoll)-v.y*sin(bodyRoll),v.x*sin(bodyRoll)+v.y*cos(bodyRoll),v.z);}col=tint;vec3 q=vec3(v.x,-v.y,v.z);q=vec3(q.x*cos(yaw)+q.z*sin(yaw),q.y,-q.x*sin(yaw)+q.z*cos(yaw));q=vec3(q.x,q.y*cos(pitch)-q.z*sin(pitch),q.y*sin(pitch)+q.z*cos(pitch));gl_Position=vec4(q.x/(zoom*aspect),q.y/zoom,q.z/40.,1.);t=uv;shade=.90;}`;
const fs=`precision mediump float;varying vec2 t;varying float shade;varying vec3 col;uniform sampler2D tex;uniform float wire;void main(){vec4 c=texture2D(tex,t);if(c.a<.12)discard;gl_FragColor=wire>.5?vec4(.36,.95,.91,.5):vec4(c.rgb*col*shade,c.a);}`;
function shader(kind,source){const s=gl.createShader(kind);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);gl.useProgram(program);
const uniforms=Object.fromEntries(['yaw','pitch','zoom','aspect','wire','anatomy','bodyPitch','bodyRoll'].map(k=>[k,gl.getUniformLocation(program,k)]));
const posBuffer=gl.createBuffer(),uvBuffer=gl.createBuffer(),indexBuffer=gl.createBuffer(),lineBuffer=gl.createBuffer();
const count=data.rows*data.columns;const uv=new Float32Array([...data.uv,...data.uv]);gl.bindBuffer(gl.ARRAY_BUFFER,uvBuffer);gl.bufferData(gl.ARRAY_BUFFER,uv,gl.STATIC_DRAW);const uvLoc=gl.getAttribLocation(program,'uv');gl.enableVertexAttribArray(uvLoc);gl.vertexAttribPointer(uvLoc,2,gl.FLOAT,false,0,0);
const posLoc=gl.getAttribLocation(program,'p');gl.bindBuffer(gl.ARRAY_BUFFER,posBuffer);gl.enableVertexAttribArray(posLoc);gl.vertexAttribPointer(posLoc,3,gl.FLOAT,false,0,0);
const indices=[],lines=[];for(let s=0;s<2;s++)for(let r=0;r<data.rows-1;r++)for(let c=0;c<data.columns-1;c++){let a=s*count+r*data.columns+c,b=a+1,d=a+data.columns,e=d+1;indices.push(a,b,e,a,e,d);lines.push(a,b,b,e,e,d,d,a);}gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,indexBuffer);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(indices),gl.STATIC_DRAW);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,lineBuffer);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(lines),gl.STATIC_DRAW);
const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
let yaw=.85,pitch=.18,zoom=9,paused=false,frame=9,last=0,ready=false;const img=new Image();img.onload=()=>{gl.bindTexture(gl.TEXTURE_2D,tex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);ready=true;document.querySelector('#status').textContent='可旋转、暂停检查 · 使用实际翅面变形数据';};img.src=textureSource;
document.querySelector('#play').onclick=e=>{paused=!paused;e.target.textContent=paused?'继续':'暂停'};document.querySelector('#front').onclick=()=>{yaw=0;pitch=.40};document.querySelector('#side').onclick=()=>{yaw=1.35;pitch=.18};document.querySelector('#top').onclick=()=>{yaw=0;pitch=1.55};let pointer=null;canvas.onpointerdown=e=>{pointer=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(pointer){yaw+=(e.clientX-pointer[0])*.007;pitch=Math.max(-1.5,Math.min(1.6,pitch+(e.clientY-pointer[1])*.007));pointer=[e.clientX,e.clientY]}};canvas.onpointerup=()=>pointer=null;canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(6,Math.min(22,zoom+e.deltaY*.01))};
const tintLoc=gl.getAttribLocation(program,'tint');
const bodyPositions=[],bodyUV=[],bodyColors=[],bodyIndices=[];
for(let i=0;i<data.anatomy.length;i+=5){bodyPositions.push(...data.anatomy.slice(i,i+3));bodyUV.push(...data.anatomy.slice(i+3,i+5));let c=data.colors[i/5];bodyColors.push(((c>>16)&255)/255,((c>>8)&255)/255,(c&255)/255);}
for(let i=0;i<bodyPositions.length/3;i+=4)bodyIndices.push(i,i+1,i+2,i,i+2,i+3);
function makeBuffer(target,values){let b=gl.createBuffer();gl.bindBuffer(target,b);gl.bufferData(target,values,gl.STATIC_DRAW);return b;}
const bodyPosBuffer=makeBuffer(gl.ARRAY_BUFFER,new Float32Array(bodyPositions)),bodyUVBuffer=makeBuffer(gl.ARRAY_BUFFER,new Float32Array(bodyUV)),bodyColorBuffer=makeBuffer(gl.ARRAY_BUFFER,new Float32Array(bodyColors)),bodyIndicesBuffer=makeBuffer(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(bodyIndices));
const bodyTex=gl.createTexture(),bodyImg=new Image();let bodyReady=false;bodyImg.onload=()=>{gl.bindTexture(gl.TEXTURE_2D,bodyTex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,bodyImg);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);bodyReady=true;};bodyImg.src=bodyTextureSource;
function drawBody(frame){if(!bodyReady)return;let phase=(data.startAge-1)*data.strokeSpeed+frame*2*Math.PI/72;gl.uniform1f(uniforms.bodyPitch,-Math.PI/4+.025*Math.sin(phase-.7)+.3*.025);gl.uniform1f(uniforms.bodyRoll,.016*Math.sin(phase));gl.uniform1f(uniforms.anatomy,1);gl.bindTexture(gl.TEXTURE_2D,bodyTex);gl.bindBuffer(gl.ARRAY_BUFFER,bodyPosBuffer);gl.vertexAttribPointer(posLoc,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,bodyUVBuffer);gl.vertexAttribPointer(uvLoc,2,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,bodyColorBuffer);gl.enableVertexAttribArray(tintLoc);gl.vertexAttribPointer(tintLoc,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,bodyIndicesBuffer);gl.drawElements(gl.TRIANGLES,bodyIndices.length,gl.UNSIGNED_SHORT,0);gl.bindBuffer(gl.ARRAY_BUFFER,posBuffer);gl.vertexAttribPointer(posLoc,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,uvBuffer);gl.vertexAttribPointer(uvLoc,2,gl.FLOAT,false,0,0);gl.disableVertexAttribArray(tintLoc);gl.vertexAttrib3f(tintLoc,1,1,1);gl.uniform1f(uniforms.anatomy,0);gl.bindTexture(gl.TEXTURE_2D,tex);}
const vertices=new Float32Array(count*2*3);function draw(now){let dt=Math.min(.1,(now-last)/1000);last=now;if(!paused)frame=(frame+dt*72/(2*Math.PI/data.strokeSpeed/20)*Number(document.querySelector('#speed').value))%72;if(ready){canvas.width=Math.round(canvas.clientWidth*devicePixelRatio);canvas.height=Math.round(canvas.clientHeight*devicePixelRatio);gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);let i=Math.floor(frame),f=frame-i,a=data.frames[i],b=data.frames[(i+1)%72];for(let k=0;k<vertices.length;k++)vertices[k]=a[k]+(b[k]-a[k])*f;gl.bindBuffer(gl.ARRAY_BUFFER,posBuffer);gl.bufferData(gl.ARRAY_BUFFER,vertices,gl.DYNAMIC_DRAW);gl.uniform1f(uniforms.yaw,yaw);gl.uniform1f(uniforms.pitch,pitch);gl.uniform1f(uniforms.zoom,zoom);gl.uniform1f(uniforms.aspect,canvas.width/canvas.height);gl.uniform1f(uniforms.wire,0);gl.uniform1f(uniforms.anatomy,0);gl.disableVertexAttribArray(tintLoc);gl.vertexAttrib3f(tintLoc,1,1,1);gl.bindTexture(gl.TEXTURE_2D,tex);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,indexBuffer);gl.drawElements(gl.TRIANGLES,indices.length,gl.UNSIGNED_SHORT,0);drawBody(frame);if(document.querySelector('#wire').checked){gl.disable(gl.DEPTH_TEST);gl.uniform1f(uniforms.wire,1);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,lineBuffer);gl.drawElements(gl.LINES,lines.length,gl.UNSIGNED_SHORT,0);}window.previewReady=true;}requestAnimationFrame(draw);}requestAnimationFrame(draw);
window.setPreviewFrame=(value)=>{paused=true;frame=value;};
</script></html>
